<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마이페이지 — Planit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* 팀원이 준 "라벤더로즈" 코드 그대로 (실제 랜딩/회원가입 화면 캡처로 사용처까지 확인함) */
    --bg:#FBEFEF;
    --surface:#FFFBF9;
    --ink:#4B3B47;
    --ink-soft:#8B7488;
    --ink-faint:#C2A9B4;
    --lav:#C5B3D3;
    --lav-deep:#A98FC2;
    --lav-soft:#EFE8F5;
    --accent:#F5CBCB;
    --accent-deep:#DFA9A9;
    --accent-soft:#FFE2E2;
    --accent-ink:#A9576B;
    --line:#F7DCE0;
    --shadow:0 10px 28px rgba(169,143,194,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  body{min-height:100vh;padding:40px 20px;}

  .page{max-width:920px;margin:0 auto;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .logo{height:34px;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-soft);font-weight:600;letter-spacing:0.02em;}

  .layout{display:flex;gap:24px;align-items:flex-start;}

  /* 왼쪽 프로필 사이드바 */
  .sidebar{
    width:250px;flex:0 0 250px;background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);text-align:center;
  }
  .avatar{
    width:84px;height:84px;border-radius:50%;margin:0 auto 16px;
    background:var(--lav-deep);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#fff;
  }
  .side-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;margin-bottom:3px;}
  .side-email{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:22px;
    word-break:break-all;}
  .side-nav{display:flex;flex-direction:column;gap:4px;text-align:left;}
  .side-nav a{
    display:block;padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);text-decoration:none;transition:background .15s,color .15s;
  }
  .side-nav a:hover{background:var(--lav-soft);color:var(--lav-deep);}
  .side-nav a.active{background:var(--lav-soft);color:var(--lav-deep);font-weight:700;}

  /* 오른쪽 콘텐츠 */
  .content{flex:1;display:flex;flex-direction:column;gap:22px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:20px;
  }
  .card-header{
    background:var(--surface);border-bottom:1px solid var(--line);
    color:var(--ink);padding:16px 24px;font-family:'Space Grotesk',sans-serif;
    font-size:15px;font-weight:700;letter-spacing:0.01em;
  }
  .card-body{padding:6px 24px 10px;}

  .row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 0;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row-label{display:flex;align-items:center;gap:12px;min-width:0;}
  .row-icon{
    width:36px;height:36px;border-radius:10px;background:var(--lav-soft);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--lav-deep);
  }
  .row-icon svg{width:18px;height:18px;}
  .row-text .t{font-size:14px;font-weight:600;color:var(--ink);}
  .row-text .d{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .btn{
    border:none;border-radius:100px;padding:9px 18px;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;transition:filter .15s,transform .05s;font-family:'Inter',sans-serif;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--lav-deep);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--lav-soft);color:var(--lav-deep);}
  .btn-ghost:hover{background:var(--lav);color:#fff;}
  .btn-danger{background:var(--accent-soft);color:var(--accent-ink);}
  .btn-danger:hover{background:var(--accent-deep);}

  .danger-row{background:var(--accent-soft);margin:0 -24px;padding:16px 24px;border-radius:0;}
  .danger-row .row-icon{background:var(--accent-deep);color:var(--accent-ink);}
  .danger-row .t{color:var(--accent-ink);}
  .danger-row .btn-danger{background:var(--accent-deep);color:var(--ink);}
  .danger-row .btn-danger:hover{filter:brightness(0.96);background:var(--accent-deep);}

  .foot-note{
    text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:26px;
    font-family:'JetBrains Mono',monospace;
  }

  @media (max-width:720px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;flex:none;}
  }
</style>
</head>
